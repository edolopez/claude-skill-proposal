<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow, noarchive" />
  <title>Private</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500&family=Inter:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; height: 100%; }
    body {
      font-family: 'Inter', ui-sans-serif, system-ui, sans-serif;
      background: #fafafa;
      color: #0f172a;
      display: grid;
      place-items: center;
      min-height: 100vh;
      padding: 2rem;
      -webkit-font-smoothing: antialiased;
    }
    .card {
      max-width: 32rem;
      text-align: center;
    }
    .eyebrow {
      font-size: 0.75rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: #64748b;
      font-variant-numeric: tabular-nums;
    }
    h1 {
      font-family: 'Fraunces', ui-serif, Georgia, serif;
      font-weight: 500;
      font-size: clamp(2.25rem, 5vw, 3rem);
      letter-spacing: -0.02em;
      line-height: 1.1;
      margin: 1.25rem 0 0;
    }
    p {
      color: #475569;
      line-height: 1.7;
      margin: 1.5rem 0 0;
      font-size: 1.0625rem;
    }
    a {
      color: #0f172a;
      text-decoration: underline;
      text-decoration-color: #cbd5e1;
      text-underline-offset: 4px;
    }
    a:hover { text-decoration-color: #0f172a; }
  </style>
</head>
<body>
  <main class="card">
    <div class="eyebrow">Private</div>
    <h1>This portal is for invited recipients.</h1>
    <p>If you were sent a proposal, please open the unique link from your email. If you've lost the link, reply to the original message and we'll resend it.</p>
  </main>
</body>
</html>
